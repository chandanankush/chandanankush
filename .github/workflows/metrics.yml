name: Metrics

on:
  schedule:
    # 00:30 UTC daily = 06:00 IST
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          # A classic PAT with "repo" scope, saved as the METRICS_TOKEN secret.
          # The default GITHUB_TOKEN only sees public activity — most of yours is
          # in private repos, so the stats would look nearly empty without a PAT.
          token: ${{ secrets.METRICS_TOKEN }}
          user: chandanankush
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          plugins_errors_fatal: no

          # Language breakdown across everything you touch, private included.
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_indepth: no

          # Contribution calendar for the last 12 months.
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Commit habits plugin disabled: it crashes (upstream bug in
          # lowlighter/metrics) on a commit missing author metadata in one
          # of the analyzed repos, regardless of owner/collaborator scope.
          plugin_habits: no

          # Count private contributions in the header numbers.
          repositories_affiliations: owner, collaborator
          repositories_skipped: wwdc-downloader, FlightLog
